name: calmcorner
description: "Calm Corner - Relaxing Games"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod: ^3.4.3
  go_router: ^18.1.1
  flutter_soloud: ^5.2.1
  haptic_feedback: ^0.8.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  intl: ^0.20.3
  state_notifier: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/audio/manifest.json
    - assets/brand/
  shaders:
    - shaders/window_glass.frag
    - shaders/sand_light.frag
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/icon_1024.png"
  adaptive_icon_background: "assets/brand/icon_bg_1024.png"
  adaptive_icon_foreground: "assets/brand/icon_fg_1024.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/brand/icon_mono_1024.png"
  web:
    generate: true
    image_path: "assets/brand/icon_1024.png"
    background_color: "#1B1838"
    theme_color: "#1B1838"
  windows:
    generate: true
    image_path: "assets/brand/icon_1024.png"
  macos:
    generate: true
    image_path: "assets/brand/icon_1024.png"

flutter_native_splash:
  color: "#1B1838"
  color_dark: "#1B1838"
  image: assets/brand/splash_logo_1152.png
  fullscreen: true
  android_12:
    color: "#1B1838"
    color_dark: "#1B1838"
    image: assets/brand/splash_logo_1152.png
  ios: true
  web: true
